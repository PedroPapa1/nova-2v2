<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nova x Volt - 2v2 | Chaveamento</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-mode="viewer">
    <header class="topbar">
      <div class="brand">
        <div>
          <p class="eyebrow">Campeonato</p>
          <h1>Nova x Volt - 2v2</h1>
        </div>
      </div>
      <div class="status-strip">
        <span id="progressText">0 de 32 partidas</span>
      </div>
    </header>

    <main>
      <section class="champion-panel" aria-live="polite">
        <div class="champion-main">
          <p class="eyebrow">Campeão</p>
          <h2 id="championName">Aguardando final</h2>
        </div>
      </section>

      <section class="bracket-wrap" aria-label="Chaveamento do campeonato">
        <div id="bracket" class="bracket"></div>
      </section>
    </main>

    <template id="matchTemplate">
      <article class="match">
        <div class="match-title"></div>
        <div class="team-row team-a"></div>
        <div class="team-row team-b"></div>
      </article>
    </template>

    <script src="./app.js"></script>
  </body>
</html>
